name: Release

# Builds a signed APK and app bundle and publishes them as a GitHub Release when a version tag is pushed:
#   git tag v1.0 && git push origin v1.0
# Requires the repository secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.
# The .aab is for Google Play (required for new apps); the .apk is for direct/sideloaded installs.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are not configured. See README > Releases."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Test and build release APK and AAB
        # The tag sets versionName (v1.2 -> 1.2); the run number keeps versionCode increasing.
        run: >
          ./gradlew testDebugUnitTest :shared:testAndroidHostTest assembleRelease bundleRelease
          -PversionName="${GITHUB_REF_NAME#v}"
          -PversionCode="${{ github.run_number }}"

      - name: Rename APK and AAB
        run: |
          cp app/build/outputs/apk/release/app-release.apk "LanguageCoast-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "LanguageCoast-${GITHUB_REF_NAME}.aab"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            LanguageCoast-*.apk
            LanguageCoast-*.aab
          generate_release_notes: true
