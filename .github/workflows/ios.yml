name: iOS

# Builds the shared code for iOS and runs its tests on the iOS simulator, which needs macOS.
on:
  push:
    paths: &ios-paths
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths: *ios-paths

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared code on iOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/
