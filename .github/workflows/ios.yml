name: iOS

# Builds the shared code for iOS and runs its tests on the iOS simulator, which needs macOS.
# All jobs run on the macOS image the release workflow uses (ios-release.yml), so the Xcode and iOS SDK that
# build the App Store upload are the ones tested here. Change the image in both files together.
on:
  push:
    paths: &ios-paths
      - "shared/**"
      - "iosApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/ios.yml"
  pull_request:
    paths: *ios-paths

concurrency:
  group: ios-${{ github.ref }}
  # A newer push to a pull request replaces its older run; every push to main gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared:
    name: Shared code on iOS
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native's compiler and iOS toolchain (about 1 GB), which Gradle would otherwise download on every run.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/

  app:
    name: iOS app on the simulator
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native's compiler and iOS toolchain (about 1 GB), which Gradle would otherwise download on every run.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build the app for the simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/build CODE_SIGNING_ALLOWED=NO build

      - name: Launch the app and take a screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE"
          xcrun simctl install "$DEVICE" iosApp/build/Build/Products/Debug-iphonesimulator/iosApp.app
          xcrun simctl launch "$DEVICE" com.andreaserick.languagecoast
          sleep 30
          xcrun simctl io "$DEVICE" screenshot ios-app.png
          # Fails the step if the app has crashed since launch.
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.andreaserick.languagecoast

      - name: Show the app's log
        if: always()
        run: xcrun simctl spawn booted log show --last 5m --predicate 'process == "iosApp"' --style compact | tail -100 || true

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-app-screenshot
          path: ios-app.png
          if-no-files-found: ignore

  device:
    name: iOS app for iPhones
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Kotlin/Native's compiler and iOS toolchain (about 1 GB), which Gradle would otherwise download on every run.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # What an App Store upload starts from: the Release build for real iPhones (arm64), archived with the
      # command the release workflow uses (ios-release.yml). Signing needs an Apple developer account, so it
      # is left out here, as it is there until the export.
      - name: Archive the app for iPhones
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Check the app has its icon, launch colour and privacy manifest
        run: |
          APP="$RUNNER_TEMP/iosApp.xcarchive/Products/Applications/iosApp.app"
          test -f "$APP/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy is missing from the app"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::The asset catalog with the app icon is missing from the app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist"
          # The launch screen's colour, without which iOS shows a white or black screen while the app starts.
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen:UIColorName" "$APP/Info.plist"
